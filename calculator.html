<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Casio Scientific Calculator - Navigable Cursor</title>
    <style>
        :root {
            --calculator-bg: #3a3d40;
            --calculator-border: #282a2b;
            --screen-bg: #c3ccb5;
            --screen-text: #1d201a;
            --btn-dark-bg: #2d2f31;
            --btn-light-bg: #ebebeb;
            --btn-green-bg: #8cb82b;
            --text-white: #ffffff;
            --text-dark: #111111;
            --lbl-shift: #e5a93b;
            --lbl-alpha: #ce5a70;
            --lbl-blue: #4a90e2;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(135deg, #4f5459 0%, #232526 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 5px;
            overflow: hidden;
        }

        .casio-body {
            background: var(--calculator-bg);
            width: 100%;
            max-width: 390px;
            height: 98vh;
            max-height: calc(100vw * 16 / 9);
            border-radius: 24px;
            padding: 12px 14px 14px 14px;
            box-shadow: inset 0 3px 5px rgba(255,255,255,0.2),
                        inset 0 -3px 5px rgba(0,0,0,0.4),
                        0 15px 30px rgba(0,0,0,0.5);
            border: 3px solid var(--calculator-border);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* BRANDING */
        .brand-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 4px;
            margin-bottom: 4px;
        }
        .brand {
            color: var(--text-white);
            font-size: 1.1rem;
            font-weight: 900;
            letter-spacing: 1.5px;
            font-style: italic;
        }
        .model-num {
            color: #888;
            font-size: 0.65rem;
            font-weight: bold;
        }

        /* SCREEN STYLING */
        .screen-container {
            background: var(--screen-bg);
            border-radius: 8px;
            padding: 6px 10px;
            box-shadow: inset 0 4px 10px rgba(0,0,0,0.3);
            border: 2px solid #222;
            height: 18%;
            min-height: 90px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .indicators {
            display: flex;
            gap: 12px;
            font-size: 0.65rem;
            font-weight: bold;
            color: var(--screen-text);
            opacity: 0.8;
            height: 12px;
        }

        .indicator {
            visibility: hidden;
        }
        .indicator.active {
            visibility: visible;
        }

        .math-input-line {
            font-family: 'Courier New', monospace;
            font-size: 1.25rem;
            color: var(--screen-text);
            text-align: left;
            word-wrap: break-word;
            overflow-y: auto;
            max-height: 45px;
            line-height: 1.2;
            font-weight: bold;
            white-space: pre-wrap;
            position: relative;
        }

        .math-input-line sup {
            font-size: 0.85rem;
            font-weight: bold;
            color: #000;
        }

        /* BLINKING CURSOR IMPLEMENTATION */
        @keyframes casioBlink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
        .custom-cursor {
            display: inline-block;
            width: 3px;
            height: 1.2rem;
            background-color: var(--screen-text);
            vertical-align: middle;
            animation: casioBlink 0.8s step-end infinite;
            margin: 0 1px;
        }
        sup .custom-cursor {
            height: 0.8rem;
            width: 2px;
        }

        .math-output-line {
            font-family: 'Courier New', monospace;
            font-size: 1.8rem;
            color: var(--screen-text);
            text-align: right;
            font-weight: bold;
            height: 30px;
            line-height: 30px;
        }

        /* MODIFIER AND D-PAD COMPACT ROW */
        .row-top-modifiers {
            display: grid;
            grid-template-columns: 1fr 1fr 1.2fr 1fr 1fr;
            gap: 5px;
            align-items: center;
            margin-bottom: 6px;
        }

        /* D-PAD DESIGN */
        .dpad-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            width: 65px;
            height: 52px;
            margin: 0 auto;
            position: relative;
        }
        .dpad-btn {
            background: #222;
            border: 1px solid #444;
            position: absolute;
            cursor: pointer;
        }
        .dpad-btn:active {
            background: #333;
        }
        .dpad-up { top: 0; left: 19px; width: 27px; height: 18px; border-radius: 6px 6px 0 0; }
        .dpad-down { bottom: 0; left: 19px; width: 27px; height: 18px; border-radius: 0 0 6px 6px; }
        .dpad-left { left: 0; top: 14px; width: 22px; height: 24px; border-radius: 6px 0 0 6px; }
        .dpad-right { right: 0; top: 14px; width: 22px; height: 24px; border-radius: 0 6px 6px 0; }
        .dpad-center { top: 14px; left: 19px; width: 27px; height: 24px; background: #151515; border: none; pointer-events: none; }

        .btn-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            padding-top: 11px;
        }

        .sub-labels {
            position: absolute;
            top: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            font-size: 0.58rem;
            font-weight: bold;
            padding: 0 2px;
        }
        .lbl-s { color: var(--lbl-shift); }
        .lbl-a { color: var(--lbl-alpha); }

        .casio-btn {
            width: 100%;
            border: none;
            outline: none;
            cursor: pointer;
            box-shadow: 0 2px 0 #151617;
            transition: all 0.05s ease;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .casio-btn:active {
            transform: translateY(2px);
            box-shadow: none;
        }

        .btn-oval {
            height: 24px;
            border-radius: 12px;
            font-size: 0.75rem;
        }

        .btn-rect {
            height: 26px;
            border-radius: 4px;
            font-size: 0.75rem;
        }

        .grid-scientific {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 6px 5px;
            margin-bottom: 6px;
        }

        .grid-base-pad {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px 6px;
        }

        .key-dark {
            background: var(--btn-dark-bg);
            color: var(--text-white);
        }
        .key-light {
            background: var(--btn-light-bg);
            color: var(--text-dark);
            box-shadow: 0 2px 0 #bcbcbc;
            font-size: 1.05rem;
            border-radius: 5px;
            height: 33px;
        }
        .key-green {
            background: var(--btn-green-bg);
            color: var(--text-white);
            box-shadow: 0 2px 0 #5d7c19;
            font-size: 0.85rem;
            border-radius: 5px;
            height: 33px;
        }

        .span-2 { grid-column: span 2; }
    </style>
</head>
<body>

<div class="casio-body">
    <div class="brand-row">
        <div class="brand">EKA-CALC</div>
        <div class="model-num">STEM</div>
    </div>

    <div class="screen-container">
        <div class="indicators">
            <span id="ind-shift" class="indicator">S</span>
            <span id="ind-alpha" class="indicator">A</span>
            <span id="ind-deg" class="indicator active">D</span>
            <span style="margin-left: auto;" class="indicator active">Math</span>
        </div>
        <div id="display-input" class="math-input-line"></div>
        <div id="display-output" class="math-output-line">0</div>
    </div>

    <div class="row-top-modifiers">
        <div class="btn-wrapper">
            <button class="casio-btn btn-oval key-dark" style="background:#444; color:var(--lbl-shift);" onclick="pressShift()">SHIFT</button>
        </div>
        <div class="btn-wrapper">
            <button class="casio-btn btn-oval key-dark" style="background:#444; color:var(--lbl-alpha);" onclick="pressAlpha()">ALPHA</button>
        </div>

        <div class="dpad-container">
            <button class="dpad-btn dpad-up" onclick="moveCursor('up')"></button>
            <button class="dpad-btn dpad-left" onclick="moveCursor('left')"></button>
            <button class="dpad-btn dpad-center"></button>
            <button class="dpad-btn dpad-right" onclick="moveCursor('right')"></button>
            <button class="dpad-btn dpad-down" onclick="moveCursor('down')"></button>
        </div>

        <div class="btn-wrapper">
            <div class="sub-labels"><span class="lbl-s">SETUP</span></div>
            <button class="casio-btn btn-oval key-dark" style="font-size:0.65rem;" onclick="pressMode()">MODE</button>
        </div>
        <div class="btn-wrapper">
            <button class="casio-btn btn-oval key-dark" style="background:#993333;" onclick="powerOn()">ON</button>
        </div>
    </div>

    <div class="grid-scientific">
        <div class="btn-wrapper">
            <div class="sub-labels"><span class="lbl-s">SOLVE</span><span class="lbl-a">=</span></div>
            <button class="casio-btn btn-rect key-dark" onclick="handleSciKey('calc')">CALC</button>
        </div>
        <div class="btn-wrapper">
            <div class="sub-labels"><span class="lbl-s">d/dx</span></div>
            <button class="casio-btn btn-rect key-dark" onclick="handleSciKey('integral')">∫dx</button>
        </div>

        <div class="span-2"></div>

        <div class="btn-wrapper">
            <div class="sub-labels"><span class="lbl-s">x!</span></div>
            <button class="casio-btn btn-rect key-dark" onclick="handleSciKey('inv')">x⁻¹</button>
        </div>
        <div class="btn-wrapper">
            <div class="sub-labels"><span class="lbl-s">∑</span></div>
            <button class="casio-btn btn-rect key-dark" style="font-size:0.65rem;" onclick="handleSciKey('logbase')">log◽◽</button>
        </div>

        <div class="btn-wrapper">
            <div class="sub-labels"><span class="lbl-s">◽/◽</span></div>
            <button class="casio-btn btn-rect key-dark" style="font-size:0.65rem;" onclick="handleSciKey('fraction')">Inline/</button>
        </div>
        <div class="btn-wrapper">
            <div class="sub-labels"><span class="lbl-s">∛</span></div>
            <button class="casio-btn btn-rect key-dark" onclick="handleSciKey('sqrt')">√◽</button>
        </div>
        <div class="btn-wrapper">
            <div class="sub-labels"><span class="lbl-s">x³</span></div>
            <button class="casio-btn btn-rect key-dark" onclick="handleSciKey('square')">x²</button>
        </div>
        <div class="btn-wrapper">
            <div class="sub-labels"><span class="lbl-s">ˣ√</span></div>
            <button class="casio-btn btn-rect key-dark" onclick="handleSciKey('power')">x^◽</button>
        </div>
        <div class="btn-wrapper">
            <div class="sub-labels"><span class="lbl-s">10ˣ</span></div>
            <button class="casio-btn btn-rect key-dark" onclick="handleSciKey('log')">log</button>
        </div>
        <div class="btn-wrapper">
            <div class="sub-labels"><span class="lbl-s">eˣ</span></div>
            <button class="casio-btn btn-rect key-dark" onclick="handleSciKey('ln')">ln</button>
        </div>

        <div class="btn-wrapper">
            <div class="sub-labels"><span class="lbl-s">∠</span><span class="lbl-a">A</span></div>
            <button class="casio-btn btn-rect key-dark" onclick="handleSciKey('neg')">(-)</button>
        </div>
        <div class="btn-wrapper">
            <div class="sub-labels"><span class="lbl-s">←</span><span class="lbl-a">B</span></div>
            <button class="casio-btn btn-rect key-dark" style="font-size:0.65rem;" onclick="handleSciKey('deg')">° ' "</button>
        </div>
        <div class="btn-wrapper">
            <div class="sub-labels"><span class="lbl-s">Abs</span><span class="lbl-a">C</span></div>
            <button class="casio-btn btn-rect key-dark" onclick="handleSciKey('hyp')">hyp</button>
        </div>
        <div class="btn-wrapper">
            <div class="sub-labels"><span class="lbl-s">sin⁻¹</span><span class="lbl-a">D</span></div>
            <button class="casio-btn btn-rect key-dark" onclick="handleSciKey('sin')">sin</button>
        </div>
        <div class="btn-wrapper">
            <div class="sub-labels"><span class="lbl-s">cos⁻¹</span><span class="lbl-a">E</span></div>
            <button class="casio-btn btn-rect key-dark" onclick="handleSciKey('cos')">cos</button>
        </div>
        <div class="btn-wrapper">
            <div class="sub-labels"><span class="lbl-s">tan⁻¹</span><span class="lbl-a">F</span></div>
            <button class="casio-btn btn-rect key-dark" onclick="handleSciKey('tan')">tan</button>
        </div>

        <div class="btn-wrapper">
            <div class="sub-labels"><span class="lbl-s">STO</span></div>
            <button class="casio-btn btn-rect key-dark" onclick="handleSciKey('rcl')">RCL</button>
        </div>
        <div class="btn-wrapper">
            <div class="sub-labels"><span class="lbl-s">← i</span></div>
            <button class="casio-btn btn-rect key-dark" onclick="handleSciKey('eng')">ENG</button>
        </div>
        <div class="btn-wrapper">
            <div class="sub-labels"><span class="lbl-s">%</span></div>
            <button class="casio-btn btn-rect key-dark" onclick="handleSciKey('bracket-open')">(</button>
        </div>
        <div class="btn-wrapper">
            <div class="sub-labels"><span class="lbl-s">,</span><span class="lbl-a">X</span></div>
            <button class="casio-btn btn-rect key-dark" onclick="handleSciKey('bracket-close')">)</button>
        </div>
        <div class="btn-wrapper">
            <div class="sub-labels"><span class="lbl-s">a b/c</span><span class="lbl-a">Y</span></div>
            <button class="casio-btn btn-rect key-dark" style="font-size:0.65rem;" onclick="handleSciKey('sd')">S⇔D</button>
        </div>
        <div class="btn-wrapper">
            <div class="sub-labels"><span class="lbl-s">M-</span><span class="lbl-a">M</span></div>
            <button class="casio-btn btn-rect key-dark" onclick="handleSciKey('mplus')">M+</button>
        </div>
    </div>

    <div class="grid-base-pad">
        <div class="btn-wrapper">
            <div class="sub-labels"><span class="lbl-s">CONST</span></div>
            <button class="casio-btn key-light" onclick="pressNum('7')">7</button>
        </div>
        <div class="btn-wrapper">
            <div class="sub-labels"><span class="lbl-s">CONV</span></div>
            <button class="casio-btn key-light" onclick="pressNum('8')">8</button>
        </div>
        <div class="btn-wrapper">
            <div class="sub-labels"><span class="lbl-s">CLR</span></div>
            <button class="casio-btn key-light" onclick="pressNum('9')">9</button>
        </div>
        <div class="btn-wrapper">
            <div class="sub-labels"><span class="lbl-s">INS</span></div>
            <button class="casio-btn key-green" onclick="pressDelete()">DEL</button>
        </div>
        <div class="btn-wrapper">
            <div class="sub-labels"><span class="lbl-s">OFF</span></div>
            <button class="casio-btn key-green" onclick="pressAC()">AC</button>
        </div>

        <div class="btn-wrapper">
            <div class="sub-labels"><span class="lbl-s" style="font-size:0.5rem;">[MAT]</span></div>
            <button class="casio-btn key-light" onclick="pressNum('4')">4</button>
        </div>
        <div class="btn-wrapper">
            <div class="sub-labels"><span class="lbl-s" style="font-size:0.5rem;">[VCT]</span></div>
            <button class="casio-btn key-light" onclick="pressNum('5')">5</button>
        </div>
        <div class="btn-wrapper">
            <div class="sub-labels"></div>
            <button class="casio-btn key-light" onclick="pressNum('6')">6</button>
        </div>
        <div class="btn-wrapper">
            <div class="sub-labels"><span class="lbl-s">nPr</span></div>
            <button class="casio-btn key-light" onclick="pressOp('*')">×</button>
        </div>
        <div class="btn-wrapper">
            <div class="sub-labels"><span class="lbl-s">nCr</span></div>
            <button class="casio-btn key-light" onclick="pressOp('/')">÷</button>
        </div>

        <div class="btn-wrapper">
            <div class="sub-labels"><span class="lbl-s" style="font-size:0.5rem;">[STAT]</span></div>
            <button class="casio-btn key-light" onclick="pressNum('1')">1</button>
        </div>
        <div class="btn-wrapper">
            <div class="sub-labels"><span class="lbl-s" style="font-size:0.5rem;">[CMPLX]</span></div>
            <button class="casio-btn key-light" onclick="pressNum('2')">2</button>
        </div>
        <div class="btn-wrapper">
            <div class="sub-labels"><span class="lbl-s" style="font-size:0.5rem;">[BASE]</span></div>
            <button class="casio-btn key-light" onclick="pressNum('3')">3</button>
        </div>
        <div class="btn-wrapper">
            <div class="sub-labels"><span class="lbl-s">Pol</span></div>
            <button class="casio-btn key-light" onclick="pressOp('+')">+</button>
        </div>
        <div class="btn-wrapper">
            <div class="sub-labels"><span class="lbl-s">Rec</span></div>
            <button class="casio-btn key-light" onclick="pressOp('-')">−</button>
        </div>

        <div class="btn-wrapper">
            <div class="sub-labels"><span class="lbl-s">Rnd</span></div>
            <button class="casio-btn key-light" onclick="pressNum('0')">0</button>
        </div>
        <div class="btn-wrapper">
            <div class="sub-labels"><span class="lbl-s">Ran#</span></div>
            <button class="casio-btn key-light" onclick="pressNum('.')">.</button>
        </div>
        <div class="btn-wrapper">
            <div class="sub-labels"><span class="lbl-s">π</span><span class="lbl-a">e</span></div>
            <button class="casio-btn key-light" style="font-size:0.75rem;" onclick="handleSciKey('exp10')">×10ˣ</button>
        </div>
        <div class="btn-wrapper">
            <div class="sub-labels"><span class="lbl-s">DRG</span></div>
            <button class="casio-btn key-light" style="font-size:0.8rem;" onclick="pressAns()">Ans</button>
        </div>
        <div class="btn-wrapper">
            <div class="sub-labels"></div>
            <button class="casio-btn key-light" onclick="calculateResult()">=</button>
        </div>
    </div>
</div>

<script>
    /* COMPACT ADVANCED ARBITRARY CURSOR CALCULATOR ENGINE */
    let tokens = [];
    let cursorIndex = 0; // Tracking active input index position
    let shiftActive = false;
    let alphaActive = false;
    let lastAnswer = 0;
    let isPowerInputMode = false;

    function pressShift() {
        shiftActive = !shiftActive;
        document.getElementById('ind-shift').className = shiftActive ? 'indicator active' : 'indicator';
        alphaActive = false;
        document.getElementById('ind-alpha').className = 'indicator';
    }

    function pressAlpha() {
        alphaActive = !alphaActive;
        document.getElementById('ind-alpha').className = alphaActive ? 'indicator active' : 'indicator';
        shiftActive = false;
        document.getElementById('ind-shift').className = 'indicator';
    }

    function powerOn() {
        pressAC();
    }

    function pressAC() {
        tokens = [];
        cursorIndex = 0;
        isPowerInputMode = false;
        clearModifiers();
        renderInput();
        document.getElementById('display-output').innerText = "0";
    }

    // Interactive targeted deletion at specific cursor position
    function pressDelete() {
        if (cursorIndex > 0) {
            tokens.splice(cursorIndex - 1, 1);
            cursorIndex--;
            updateContextFromCursor();
            renderInput();
        }
    }

    function clearModifiers() {
        shiftActive = false;
        alphaActive = false;
        document.getElementById('ind-shift').className = 'indicator';
        document.getElementById('ind-alpha').className = 'indicator';
    }

    // Helper to generic slice-insert tokens seamlessly at cursor
    function insertTokenAtCursor(type, val, display) {
        tokens.splice(cursorIndex, 0, { type: type, val: val, display: display });
        cursorIndex++;
    }

    function pressNum(num) {
        if (shiftActive && num === '9') { pressAC(); return; }

        let type = isPowerInputMode ? 'powernum' : 'num';
        insertTokenAtCursor(type, num, num);
        clearModifiers();
        renderInput();
    }

    function pressOp(op) {
        isPowerInputMode = false;
        let dsp = op;
        if(op === '*') dsp = '×';
        if(op === '/') dsp = '÷';
        insertTokenAtCursor('op', op, dsp);
        clearModifiers();
        renderInput();
    }

    function pressAns() {
        insertTokenAtCursor('num', lastAnswer.toString(), 'Ans');
        renderInput();
    }

    function handleSciKey(keyType) {
        if (shiftActive) {
            switch(keyType) {
                case 'square':
                    insertTokenAtCursor('pow', '**3', '³');
                    break;
                case 'sqrt':
                    insertTokenAtCursor('fn', 'Math.cbrt(', '³√(');
                    break;
                case 'sin':
                    insertTokenAtCursor('fn', 'Math.asin(', 'sin⁻¹(');
                    break;
                case 'cos':
                    insertTokenAtCursor('fn', 'Math.acos(', 'cos⁻¹(');
                    break;
                case 'tan':
                    insertTokenAtCursor('fn', 'Math.atan(', 'tan⁻¹(');
                    break;
                case 'exp10':
                    insertTokenAtCursor('num', 'Math.PI', 'π');
                    break;
                default:
                    break;
            }
            clearModifiers();
            renderInput();
            return;
        }

        if (alphaActive) {
            switch(keyType) {
                case 'exp10':
                    insertTokenAtCursor('num', 'Math.E', 'e');
                    break;
                default:
                    break;
            }
            clearModifiers();
            renderInput();
            return;
        }

        switch(keyType) {
            case 'square':
                insertTokenAtCursor('pow', '**2', '²');
                break;
            case 'power':
                isPowerInputMode = true;
                insertTokenAtCursor('pow-start', '**', '^');
                break;
            case 'sqrt':
                insertTokenAtCursor('fn', 'Math.sqrt(', '√(');
                break;
            case 'sin':
                insertTokenAtCursor('fn', 'Math.sin(', 'sin(');
                break;
            case 'cos':
                insertTokenAtCursor('fn', 'Math.cos(', 'cos(');
                break;
            case 'tan':
                insertTokenAtCursor('fn', 'Math.tan(', 'tan(');
                break;
            case 'log':
                insertTokenAtCursor('fn', 'Math.log10(', 'log(');
                break;
            case 'ln':
                insertTokenAtCursor('fn', 'Math.log(', 'ln(');
                break;
            case 'bracket-open':
                insertTokenAtCursor('num', '(', '(');
                break;
            case 'bracket-close':
                insertTokenAtCursor('num', ')', ')');
                break;
            case 'neg':
                insertTokenAtCursor('num', '-', '-');
                break;
            case 'fraction':
                insertTokenAtCursor('op', '/', '˩');
                break;
            case 'inv':
                insertTokenAtCursor('pow', '**(-1)', '⁻¹');
                break;
            case 'exp10':
                insertTokenAtCursor('op', '*10**', '×10^');
                isPowerInputMode = true;
                break;
            default:
                break;
        }
        renderInput();
    }

    // Move structural position points along multi-line formulas
    function moveCursor(dir) {
        if (dir === 'left') {
            if (cursorIndex > 0) cursorIndex--;
        } else if (dir === 'right') {
            if (cursorIndex < tokens.length) cursorIndex++;
        }
        updateContextFromCursor();
        renderInput();
    }

    // Adapts input modes dynamically depending on layout locations
    function updateContextFromCursor() {
        if (cursorIndex > 0) {
            let prevTok = tokens[cursorIndex - 1];
            if (prevTok.type === 'powernum' || prevTok.type === 'pow-start') {
                isPowerInputMode = true;
                return;
            }
        }
        isPowerInputMode = false;
    }

    // Interweaves visual responsive cursor inside regular expression flow
    function renderInput() {
        const displayBox = document.getElementById('display-input');

        let htmlString = "";
        for (let i = 0; i <= tokens.length; i++) {
            if (i === cursorIndex) {
                let insideSup = false;
                if (i > 0 && (tokens[i - 1].type === 'powernum' || tokens[i - 1].type === 'pow-start')) {
                    insideSup = true;
                }
                if (insideSup) {
                    htmlString += `<sup><span class="custom-cursor"></span></sup>`;
                } else {
                    htmlString += `<span class="custom-cursor"></span>`;
                }
            }

            if (i < tokens.length) {
                let tok = tokens[i];
                if (tok.type === 'powernum') {
                    htmlString += `<sup>${tok.display}</sup>`;
                } else {
                    htmlString += tok.display;
                }
            }
        }
        displayBox.innerHTML = htmlString;
    }

    function calculateResult() {
        if(tokens.length === 0) return;

        let evalString = "";
        tokens.forEach(tok => {
            evalString += tok.val;
        });

        let openCount = (evalString.match(/\(/g) || []).length;
        let closeCount = (evalString.match(/\)/g) || []).length;
        while(openCount > closeCount) {
            evalString += ')';
            openCount--;
        }

        try {
            let result = Function('"use strict"; return (' + evalString + ')')();
            if (isNaN(result) || !isFinite(result)) {
                document.getElementById('display-output').innerText = "Math ERROR";
            } else {
                if (!Number.isInteger(result)) {
                    result = parseFloat(result.toFixed(9));
                }
                document.getElementById('display-output').innerText = result;
                lastAnswer = result;
            }
        } catch (e) {
            document.getElementById('display-output').innerText = "Syntax ERROR";
        }
    }

    // Init display cursor
    renderInput();
</script>
