<!DOCTYPE html>
<html lang="en" data-theme="3d-glass">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>EKA Snap Mobile</title>
    <style id="theme-styles"></style>
    <style>
        /* ========== THEME VARIABLES (from GuessWord) ========== */
        :root, [data-theme="3d-glass"] {
            --bg-grad: linear-gradient(160deg, #0f172a 0%, #1e293b 100%);
            --glass-bg: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
            --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            --text-main: #f1f5f9;
            --text-sub: #94a3b8;
            --accent: #3b82f6;
            --danger: #ef4444;
            --success: #10b981;
            --cell-bg: rgba(255, 255, 255, 0.05);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: var(--bg-grad);
            color: var(--text-main);
            height: 100vh; height: 100dvh;
            width: 100vw;
            display: flex; justify-content: center; align-items: center;
            overflow: hidden; touch-action: none;
        }

        .app-container {
            width: 100vw; max-width: 480px;
            height: 100vh; height: 100dvh;
            display: flex; flex-direction: column;
            background: rgba(255,255,255,0.02);
            backdrop-filter: blur(20px);
            border-radius: 0;
            border: 1px solid var(--glass-border);
            position: relative;
        }

        header {
            padding: 10px 12px; text-align: center; flex-shrink: 0;
            background: linear-gradient(to bottom, rgba(255,255,255,0.1), transparent);
            border-bottom: 1px solid var(--glass-border);
            position: relative;
        }
        header h1 { font-size: 1.1rem; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; }

        .back-btn {
            position: absolute; left: 10px; top: 10px;
            text-decoration: none; background: rgba(255,255,255,0.1);
            width: 34px; height: 34px; display: flex; align-items: center; justify-content: center;
            border-radius: 10px; color: var(--text-main); font-weight: bold; border: 1px solid var(--glass-border);
        }

        .screens-wrapper { flex: 1; position: relative; overflow: hidden; display: flex; width: 100%; }
        .screen {
            position: absolute; inset: 0; padding: 15px;
            display: none; flex-direction: column; gap: 15px;
            animation: slideIn 0.3s ease forwards;
            overflow-y: auto; align-items: center;
            width: 100%;
        }
        .screen.active { display: flex; }
        @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .glass-card {
            background: var(--glass-bg); border: 1px solid var(--glass-border);
            border-radius: 20px; padding: 15px;
            box-shadow: var(--glass-shadow);
            display: flex; flex-direction: column; align-items: center; gap: 12px;
            width: 100%;
        }

        .input-glass {
            width: 100%; padding: 12px; border-radius: 12px;
            border: 1px solid var(--glass-border);
            background: rgba(255,255,255,0.05);
            color: var(--text-main); font-size: 1rem;
            outline: none; text-align: center; font-weight: 600;
        }

        .btn {
            min-height: 48px; width: 100%; padding: 0 20px;
            font-size: 1rem; font-weight: 700; border: none; border-radius: 12px;
            background: var(--cell-bg); color: var(--text-main);
            cursor: pointer; transition: all 0.2s;
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            border: 1px solid var(--glass-border);
        }
        .btn.primary { background: var(--accent); color: white; border: none; }
        .btn:active { transform: scale(0.96); }

        /* Stats in Header */
        .stats-bar { display: none; padding: 5px 12px; }
        .stats-row { display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; font-weight: 700; width: 100%; }
        .timer-container { flex: 1; height: 6px; background: rgba(0,0,0,0.3); border-radius: 3px; margin: 0 10px; overflow: hidden; }
        #timer-bar { height: 100%; width: 100%; background: var(--success); transition: width 1s linear; }
        .stat-badge { background: var(--glass-bg); padding: 4px 10px; border-radius: 20px; white-space: nowrap; border: 1px solid var(--glass-border); }

        /* Grid specific */
        #shapesGrid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            width: 100%;
            max-width: 400px;
            margin: auto;
        }

        .icecube {
            background: var(--cell-bg);
            border-radius: 16px;
            aspect-ratio: 1 / 1;
            display: flex; justify-content: center; align-items: center;
            border: 1px solid var(--glass-border);
            touch-action: none;
            transition: transform 0.1s;
        }
        .icecube:active { transform: scale(0.9); background: rgba(255,255,255,0.1); }

        /* Shape Styles (keeping original logic but fixing aspect) */
        .shape-container { width: 60%; height: 60%; display: flex; align-items: center; justify-content: center; position: relative; }
        .circle { width: 100%; height: 100%; border-radius: 50%; }
        .square { width: 100%; height: 100%; }
        .triangle {
            width: 0; height: 0;
            border-left: 25px solid transparent;
            border-right: 25px solid transparent;
            border-bottom: 50px solid;
        }
        .star { width: 100%; height: 100%; clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%); }
        .hexagon { width: 100%; height: 100%; clip-path: polygon(25% 5%, 75% 5%, 100% 50%, 75% 95%, 25% 95%, 0% 50%); }

        #prompt-card {
            width: 100%;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 12px;
            text-align: center;
            margin-bottom: 10px;
        }

        /* Leaderboard */
        .leaderboard {
            width: 100%; max-height: 35vh; overflow-y: auto; background: rgba(0,0,0,0.2);
            border-radius: 15px; border: 1px solid var(--glass-border);
        }
        .leaderboard table { width: 100%; border-collapse: collapse; }
        .leaderboard th, .leaderboard td { padding: 10px; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 0.8rem; }
        .leaderboard th { color: var(--accent); }

        #firebaseStatus { font-size: 10px; color: var(--success); margin-bottom: 5px; opacity: 0.8; }
    </style>
</head>
<body>

<div class="app-container">
    <header>
        <a href="games.html" class="back-btn">⬅</a>
        <h1 id="header-title">EKA Snap Mobile</h1>
        <div id="game-stats-container" class="stats-bar">
            <div class="stats-row">
                <span class="stat-badge" id="disp-timer">⏱️ 60s</span>
                <div class="timer-container"><div id="timer-bar"></div></div>
                <span class="stat-badge" id="disp-level">#1</span>
                <span class="stat-badge" id="disp-score">🌟 0</span>
            </div>
        </div>
    </header>

    <div class="screens-wrapper">
        <!-- Welcome Screen -->
        <section id="screen-welcome" class="screen active">
            <div style="font-size: 2rem; font-weight: 900; color: var(--accent); text-align: center; margin: 10px 0;">MOBILE SNAP</div>
            <div class="glass-card">
                <input type="text" id="playerName" class="input-glass" placeholder="Player Name" maxlength="12">
                <select id="ageSelect" class="input-glass">
                    <option value="Age < 8">Age < 8 (Child)</option>
                    <option value="Age 8-12">Age 8-12 (Junior)</option>
                    <option value="Age 12-16" selected>Age 12-16 (Standard)</option>
                    <option value="Age 16-20">Age 16-20 (Teen)</option>
                    <option value="Age 20+">Age 20+ (Expert)</option>
                </select>
                <button class="btn primary" id="startBtn">▶ START MISSION</button>
            </div>

            <div id="firebaseStatus">Connecting...</div>
            <div class="leaderboard">
                <div style="display: flex; gap: 5px; padding: 8px;">
                    <button class="btn" style="flex:1; min-height: 30px; font-size: 0.7rem;" onclick="loadScoresFromFirebase('top')" id="btnTop">🏆 TOP 10</button>
                    <button class="btn" style="flex:1; min-height: 30px; font-size: 0.7rem; opacity: 0.6;" onclick="loadScoresFromFirebase('recent')" id="btnRecent">🕒 RECENT</button>
                </div>
                <table>
                    <thead><tr><th>Rank</th><th>Score</th><th>Name</th></tr></thead>
                    <tbody id="leaderboardBody"></tbody>
                </table>
            </div>
        </section>

        <!-- Game Screen -->
        <section id="screen-game" class="screen">
            <div id="prompt-card">
                <span id="prompt" style="font-size: 1.1rem; font-weight: 800;">Get Ready...</span>
            </div>
            <div id="shapesGrid"></div>
            <div style="flex: 1;"></div>
        </section>

        <!-- Result Screen -->
        <section id="screen-result" class="screen">
            <div class="glass-card" style="margin-top: 20%;">
                <h2 style="font-size: 1.5rem;">MISSION COMPLETE</h2>
                <div style="font-size: 3rem; font-weight: 900; margin: 10px 0; color: var(--accent);" id="finalScore">0</div>
                <button class="btn primary" id="submitScoreBtn">SAVE SCORE</button>
                <button class="btn" id="restartBtn">PLAY AGAIN</button>
                <button class="btn" onclick="location.reload()" style="background: transparent;">MENU</button>
            </div>
        </section>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAEcPKE7n33wNUGxYpyqm5UWFjwXTT_x_c",
        authDomain: "eka-sir.firebaseapp.com",
        databaseURL: "https://eka-sir-default-rtdb.firebaseio.com",
        projectId: "eka-sir",
        storageBucket: "eka-sir.firebasestorage.app",
        messagingSenderId: "1022804634776",
        appId: "1:1022804634776:web:4c547efa80d625885734ed",
        measurementId: "G-5P543VP1EZ"
    };

    let firebaseDB = null;
    let firebaseInitialized = false;

    function initFirebase() {
        try {
            firebase.initializeApp(firebaseConfig);
            firebaseDB = firebase.database();
            firebaseInitialized = true;
            document.getElementById('firebaseStatus').textContent = '✅ Global Sync Active';
        } catch (e) {
            document.getElementById('firebaseStatus').textContent = '❌ Offline Mode';
        }
    }

    let state = {
        score: 0, timeLeft: 60, isGameActive: false, timerInterval: null,
        currentAge: "Age 12-16", name: "Anonymous"
    };

    const colors = ['#ef4444', '#3b82f6', '#10b981', '#f59e0b', '#8b5cf6', '#ec4899', '#ffffff'];
    const shapes = ['circle', 'square', 'triangle', 'star', 'hexagon'];

    const AGE_CONFIGS = {
        "Age < 8":   { timeBonus: 8, penalty: 2, levelStep: 50, startFreq: 400 },
        "Age 8-12":  { timeBonus: 5, penalty: 5, levelStep: 100, startFreq: 523 },
        "Age 12-16": { timeBonus: 4, penalty: 8, levelStep: 150, startFreq: 600 },
        "Age 16-20": { timeBonus: 3, penalty: 10, levelStep: 200, startFreq: 700 },
        "Age 20+":   { timeBonus: 2, penalty: 15, levelStep: 250, startFreq: 800 }
    };

    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;
    const synth = window.speechSynthesis;

    function initAudio() {
        if (!audioCtx) audioCtx = new AudioContext();
        if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playSound(type) {
        initAudio();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        const now = audioCtx.currentTime;

        if (type === 'correct') {
            osc.frequency.setValueAtTime(AGE_CONFIGS[state.currentAge].startFreq, now);
            osc.frequency.exponentialRampToValueAtTime(1000, now + 0.1);
            gain.gain.setValueAtTime(0.1, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
            osc.start(); osc.stop(now + 0.15);
        } else if (type === 'wrong') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(150, now);
            gain.gain.setValueAtTime(0.1, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
            osc.start(); osc.stop(now + 0.2);
        }
    }

    function speak(text) {
        if (!synth) return;
        synth.cancel();
        const utter = new SpeechSynthesisUtterance(text);
        utter.rate = 1.4;
        synth.speak(utter);
    }

    function navTo(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        document.getElementById('game-stats-container').style.display = (id === 'screen-game') ? 'block' : 'none';
        document.getElementById('header-title').style.display = (id === 'screen-game') ? 'none' : 'block';
    }

    function handleStart() {
        const name = document.getElementById('playerName').value.trim();
        if(!name) { alert("Please enter name"); return; }
        state.name = name;
        state.currentAge = document.getElementById('ageSelect').value;
        localStorage.setItem('eka_player_name', name);

        initAudio();
        state.score = 0;
        state.timeLeft = 60;
        state.isGameActive = true;
        updateStats();
        navTo('screen-game');

        nextPrompt();
        if(state.timerInterval) clearInterval(state.timerInterval);
        state.timerInterval = setInterval(() => {
            if (!state.isGameActive) return;
            state.timeLeft--;
            updateTimerUI();
            if(state.timeLeft <= 0) endGame();
        }, 1000);
    }

    function updateTimerUI() {
        document.getElementById('disp-timer').textContent = `⏱️ ${state.timeLeft}s`;
        const pct = (state.timeLeft / 60) * 100;
        const bar = document.getElementById('timer-bar');
        bar.style.width = pct + "%";
        bar.style.backgroundColor = pct < 25 ? "var(--danger)" : "var(--success)";
    }

    function updateStats() {
        document.getElementById('disp-score').textContent = `🌟 ${state.score}`;
        document.getElementById('disp-level').textContent = state.currentAge.replace('Age ', '');
    }

    function nextPrompt() {
        const colorNames = ['Red', 'Blue', 'Green', 'Orange', 'Purple', 'Pink', 'White'];
        const idxC = Math.floor(Math.random() * colors.length);
        const idxS = Math.floor(Math.random() * shapes.length);
        const targetColor = colors[idxC];
        const targetColorName = colorNames[idxC];
        const targetShape = shapes[idxS];

        document.getElementById('prompt').innerHTML = `Find: <b style="color:${targetColor}">${targetColorName.toUpperCase()} ${targetShape.toUpperCase()}</b>`;
        speak(`${targetColorName} ${targetShape}`);
        renderGrid(targetColor, targetShape);
    }

    function renderGrid(targetC, targetS) {
        const grid = document.getElementById('shapesGrid');
        grid.innerHTML = '';
        let pool = [{ color: targetC, shape: targetS }];
        while(pool.length < 9) {
            let rc = colors[Math.floor(Math.random() * colors.length)];
            let rs = shapes[Math.floor(Math.random() * shapes.length)];
            if(!pool.find(p => p.color === rc && p.shape === rs)) pool.push({color: rc, shape: rs});
        }
        pool.sort(() => Math.random() - 0.5).forEach(item => {
            const cube = document.createElement('div');
            cube.className = 'icecube';
            const container = document.createElement('div');
            container.className = 'shape-container';
            const shp = document.createElement('div');
            shp.className = item.shape;

            if(item.shape === 'triangle') shp.style.borderBottomColor = item.color;
            else shp.style.backgroundColor = item.color;

            cube.onclick = (e) => {
                if(!state.isGameActive) return;
                const config = AGE_CONFIGS[state.currentAge];
                if(item.color === targetC && item.shape === targetS) {
                    state.score += 10;
                    playSound('correct');
                    if (state.score % config.levelStep === 0) {
                        state.timeLeft = Math.min(60, state.timeLeft + config.timeBonus);
                    }
                    if(navigator.vibrate) navigator.vibrate(40);
                } else {
                    state.score = Math.max(0, state.score - config.penalty);
                    playSound('wrong');
                }
                updateStats();
                nextPrompt();
            };

            container.appendChild(shp);
            cube.appendChild(container);
            grid.appendChild(cube);
        });
    }

    function endGame() {
        state.isGameActive = false;
        clearInterval(state.timerInterval);
        document.getElementById('finalScore').textContent = state.score;
        navTo('screen-result');
    }

    async function submitScore() {
        const btn = document.getElementById('submitScoreBtn');
        btn.disabled = true; btn.textContent = 'SAVING...';

        if (firebaseInitialized && state.score > 0) {
            await firebaseDB.ref('scores_snap').push({
                name: state.name,
                score: state.score,
                age: state.currentAge,
                timestamp: firebase.database.ServerValue.TIMESTAMP
            });
        }
        btn.textContent = 'SAVED!';
        setTimeout(() => location.reload(), 800);
    }

    function loadScoresFromFirebase(mode = 'top') {
        if (!firebaseInitialized) return;
        const tbody = document.getElementById('leaderboardBody');
        tbody.innerHTML = '<tr><td colspan="3">Syncing...</td></tr>';

        document.getElementById('btnTop').style.opacity = mode === 'top' ? '1' : '0.6';
        document.getElementById('btnRecent').style.opacity = mode === 'recent' ? '1' : '0.6';

        let query = firebaseDB.ref('scores_snap');
        if (mode === 'top') query = query.orderByChild('score').limitToLast(10);
        else query = query.limitToLast(10);

        query.once('value', snapshot => {
            let list = [];
            snapshot.forEach(c => list.push(c.val()));
            if (mode === 'top') list.sort((a,b) => b.score - a.score);
            else list.sort((a,b) => (b.timestamp||0) - (a.timestamp||0));

            tbody.innerHTML = list.map((s, i) => `
                <tr>
                    <td>${mode === 'top' ? i+1 : '#'}</td>
                    <td style="font-weight:bold;color:var(--accent)">${s.score}</td>
                    <td>${s.name}</td>
                </tr>
            `).join('') || '<tr><td colspan="3">No scores yet</td></tr>';
        });
    }

    document.getElementById('startBtn').onclick = handleStart;
    document.getElementById('restartBtn').onclick = handleStart;
    document.getElementById('submitScoreBtn').onclick = submitScore;

    window.onload = () => {
        const savedName = localStorage.getItem('eka_player_name');
        if (savedName) document.getElementById('playerName').value = savedName;
        initFirebase();
        loadScoresFromFirebase();
    };
</script>
</body>
</html>
