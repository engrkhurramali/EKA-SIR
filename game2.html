<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>EKA Snap Mobile</title>
    <style>
        /* ========== THEME VARIABLES ========== */
        :root, [data-theme="3d-glass"] {
            --bg-grad: linear-gradient(160deg, #0f172a 0%, #1e293b 100%);
            --glass-bg: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
            --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            --text-main: #f1f5f9;
            --text-sub: #94a3b8;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --danger: #ef4444;
            --success: #10b981;
            --warning: #f59e0b;
            --card-bg: rgba(255, 255, 255, 0.05);
            --radius: 20px;
        }

        [data-theme="modern-2x2"] {
            --bg-grad: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
            --glass-bg: rgba(255, 255, 255, 0.5);
            --glass-border: rgba(255, 255, 255, 0.8);
            --text-main: #44403c;
            --text-sub: #78716c;
            --accent: #fb923c;
            --accent-hover: #f97316;
            --danger: #ef4444;
            --success: #22c55e;
            --warning: #f59e0b;
            --card-bg: rgba(255, 255, 255, 0.6);
        }

        [data-theme="dark-neon"] {
            --bg-grad: linear-gradient(135deg, #000000 0%, #0f172a 100%);
            --glass-bg: rgba(15, 23, 42, 0.8);
            --glass-border: rgba(59, 130, 246, 0.3);
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --accent: #3b82f6;
            --accent-hover: #60a5fa;
            --danger: #f43f5e;
            --success: #10b981;
            --warning: #f59e0b;
            --card-bg: rgba(30, 41, 59, 0.9);
        }

        [data-theme="midnight-dark"] {
            --bg-grad: linear-gradient(135deg, #020617 0%, #0f172a 100%);
            --glass-bg: rgba(15, 23, 42, 0.9);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-main: #f1f5f9;
            --text-sub: #94a3b8;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --danger: #ef4444;
            --success: #22c55e;
            --warning: #f59e0b;
            --card-bg: rgba(30, 41, 59, 0.95);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: var(--bg-grad);
            background-attachment: fixed;
            color: var(--text-main);
            height: 100vh; height: 100dvh;
            width: 100vw;
            display: flex; align-items: center; justify-content: center;
            overflow: hidden; touch-action: none;
        }

        .app-container {
            width: 100vw; max-width: 480px;
            height: 100vh; height: 100dvh;
            display: flex; flex-direction: column;
            position: relative; overflow: hidden;
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(20px);
            border-radius: 0;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.2);
            border: 1px solid var(--glass-border);
        }

        .screen { display: none; width: 100%; flex: 1; animation: fadeIn 0.4s ease; flex-direction: column; padding: 1rem; overflow-y: auto; }
        .screen.active { display: flex; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .card {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 2px solid var(--glass-border);
            border-radius: var(--radius);
            padding: 1.5rem;
            box-shadow: var(--glass-shadow);
            margin-bottom: 1rem;
            width: 100%;
            display: flex; flex-direction: column; align-items: center; gap: 12px;
        }

        header {
            padding: 10px 12px; text-align: center; flex-shrink: 0;
            background: linear-gradient(to bottom, rgba(255,255,255,0.1), transparent);
            border-bottom: 1px solid var(--glass-border);
            position: relative;
        }
        header h1 { font-size: 1.1rem; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; }

        .back-btn {
            position: absolute; left: 10px; top: 10px;
            text-decoration: none; background: rgba(255,255,255,0.1);
            width: 36px; height: 36px; display: flex; align-items: center; justify-content: center;
            border-radius: 10px; color: var(--text-main); font-weight: bold; border: 1px solid var(--glass-border);
            z-index: 10;
        }

        .btn {
            min-height: 48px; width: 100%; padding: 0 20px;
            font-size: 1rem; font-weight: 700; border: none; border-radius: 12px;
            background: var(--card-bg); color: var(--text-main);
            cursor: pointer; transition: all 0.2s;
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            border: 1px solid var(--glass-border);
        }
        .btn.primary { background: var(--accent); color: white; border: none; }
        .btn.secondary { background: rgba(255,255,255,0.1); color: var(--text-main); }
        .btn:active { transform: scale(0.96); }

        .input {
            width: 100%; padding: 12px; border-radius: 12px;
            border: 1px solid var(--glass-border);
            background: rgba(255,255,255,0.05);
            color: var(--text-main); font-size: 1rem;
            outline: none; text-align: center; font-weight: 600;
            margin-bottom: 10px;
        }

        /* Stats in Header */
        .stats-bar { display: none; padding: 5px 12px; }
        .stats-row { display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; font-weight: 700; width: 100%; }
        .timer-container { flex: 1; height: 6px; background: rgba(0,0,0,0.3); border-radius: 3px; margin: 0 10px; overflow: hidden; }
        #timer-bar { height: 100%; width: 100%; background: var(--success); transition: width 1s linear; }
        .stat-badge { background: var(--glass-bg); padding: 4px 10px; border-radius: 20px; white-space: nowrap; border: 1px solid var(--glass-border); }

        /* Grid specific */
        #shapesGrid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            width: 100%;
            max-width: 400px;
            margin: auto;
        }

        .icecube {
            background: var(--card-bg);
            border-radius: 16px;
            aspect-ratio: 1 / 1;
            display: flex; justify-content: center; align-items: center;
            border: 1px solid var(--glass-border);
            touch-action: none;
            transition: transform 0.1s;
        }
        .icecube:active { transform: scale(0.9); background: rgba(255,255,255,0.1); }

        /* Shape Styles */
        .shape-container { width: 65%; height: 65%; display: flex; align-items: center; justify-content: center; position: relative; }
        .circle { width: 100%; height: 100%; border-radius: 50%; }
        .square { width: 100%; height: 100%; }
        .triangle { width: 0; height: 0; border-left: 25px solid transparent; border-right: 25px solid transparent; border-bottom: 45px solid; }
        .star { width: 100%; height: 100%; clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%); }
        .hexagon { width: 100%; height: 100%; clip-path: polygon(25% 5%, 75% 5%, 100% 50%, 75% 95%, 25% 95%, 0% 50%); }

        #prompt-card {
            width: 100%;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 12px;
            text-align: center;
            margin-bottom: 10px;
        }

        /* Leaderboard */
        .leaderboard {
            width: 100%; max-height: 40vh; overflow-y: auto; background: rgba(0,0,0,0.2);
            border-radius: 15px; border: 1px solid var(--glass-border);
        }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 0.8rem; }
        th { color: var(--accent); font-weight: 800; background: rgba(255,255,255,0.02); text-transform: uppercase; font-size: 0.7rem; }
        td b { color: var(--text-main); font-size: 0.85rem; }
        td small { color: var(--text-sub); display: block; margin-top: 2px; }

        .tabs { display: flex; gap: 0.5rem; margin-bottom: 10px; width: 100%; }
        .tab { flex: 1; padding: 10px; text-align: center; border-radius: 12px; background: rgba(255,255,255,0.1); border: 1px solid var(--glass-border); cursor: pointer; font-weight: 800; font-size: 0.8rem; }
        .tab.active { background: var(--accent); color: white; }

        .theme-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.8rem; margin: 10px 0; width: 100%; }
        .theme-btn { padding: 0.8rem; border-radius: 12px; border: 2px solid var(--glass-border); background: rgba(255,255,255,0.1); color: var(--text-main); cursor: pointer; text-align: center; font-size: 0.75rem; font-weight: 700; transition: all 0.2s; }
        .theme-btn.selected { background: var(--accent); color: white; border-color: var(--accent); }

        #firebaseStatus { font-size: 10px; color: var(--success); margin-top: 5px; opacity: 0.8; text-align: center; }
    </style>
</head>
<body data-theme="3d-glass">

<div class="app-container">
    <header>
        <a href="games.html" class="back-btn">⬅</a>
        <h1 id="header-title">EKA Snap Mobile</h1>
        <div id="game-stats-container" class="stats-bar">
            <div class="stats-row">
                <span class="stat-badge" id="disp-timer">⏱️ 60s</span>
                <div class="timer-container"><div id="timer-bar"></div></div>
                <span class="stat-badge" id="disp-level">#1</span>
                <span class="stat-badge" id="disp-score">🌟 0</span>
            </div>
        </div>
    </header>

    <!-- Welcome Screen -->
    <section id="screen-welcome" class="screen active">
        <div style="font-size: 2.2rem; font-weight: 900; color: var(--accent); text-align: center; margin: 20px 0;">MOBILE SNAP</div>
        <div class="card">
            <input type="text" id="playerName" class="input" placeholder="Player Name" maxlength="12">
            <select id="ageSelect" class="input">
                <option value="Age < 8">Age < 8 (Child)</option>
                <option value="Age 8-12">Age 8-12 (Junior)</option>
                <option value="Age 12-16" selected>Age 12-16 (Standard)</option>
                <option value="Age 16-20">Age 16-20 (Teen)</option>
                <option value="Age 20+">Age 20+ (Expert)</option>
            </select>

            <h3 style="font-size: 0.9rem; margin-top: 5px;">🎨 SELECT THEME</h3>
            <div class="theme-grid">
                <div class="theme-btn selected" onclick="setTheme('3d-glass')">3D GLASS</div>
                <div class="theme-btn" onclick="setTheme('modern-2x2')">MODERN</div>
                <div class="theme-btn" onclick="setTheme('dark-neon')">NEON</div>
                <div class="theme-btn" onclick="setTheme('midnight-dark')">DARK</div>
            </div>

            <button class="btn primary" onclick="handleStart()">▶ START MISSION</button>
            <button class="btn secondary" onclick="showLeaderboard('top')">🏆 LEADERBOARD</button>
        </div>
        <div id="firebaseStatus">Connecting...</div>
    </section>

    <!-- Game Screen -->
    <section id="screen-game" class="screen">
        <div id="prompt-card">
            <span id="prompt" style="font-size: 1.1rem; font-weight: 800;">Get Ready...</span>
        </div>
        <div id="shapesGrid"></div>
        <div style="flex: 1;"></div>
    </section>

    <!-- Result Screen -->
    <section id="screen-result" class="screen">
        <div class="card" style="margin-top: 20%;">
            <h2 style="font-size: 1.5rem;">MISSION COMPLETE</h2>
            <div style="font-size: 4rem; font-weight: 900; margin: 10px 0; color: var(--accent);" id="finalScore">0</div>
            <button class="btn primary" id="submitScoreBtn" onclick="submitScore()">SAVE SCORE</button>
            <button class="btn secondary" onclick="handleStart()">PLAY AGAIN</button>
            <button class="btn secondary" onclick="location.reload()">MAIN MENU</button>
        </div>
    </section>

    <!-- Leaderboard Screen -->
    <section id="screen-leaderboard" class="screen">
        <div class="header" style="background:transparent; border:none; padding:0; margin-bottom:15px;">
            <button class="back-btn" onclick="navTo('screen-welcome')">⬅</button>
            <h2 style="margin: 0 auto;">🏆 Rankings</h2>
        </div>
        <div class="card">
            <div class="tabs">
                <div class="tab active" id="btnTop" onclick="showLeaderboard('top')">Top 15</div>
                <div class="tab" id="btnRecent" onclick="showLeaderboard('recent')">Recent 60</div>
            </div>
            <div class="leaderboard">
                <table>
                    <thead><tr><th>Player</th><th>Score</th><th>Date</th></tr></thead>
                    <tbody id="leaderboardBody"></tbody>
                </table>
            </div>
            <button class="btn secondary" style="margin-top: 1rem;" onclick="navTo('screen-welcome')">Back to Menu</button>
        </div>
    </section>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAEcPKE7n33wNUGxYpyqm5UWFjwXTT_x_c",
        authDomain: "eka-sir.firebaseapp.com",
        databaseURL: "https://eka-sir-default-rtdb.firebaseio.com",
        projectId: "eka-sir",
        storageBucket: "eka-sir.firebasestorage.app",
        messagingSenderId: "1022804634776",
        appId: "1:1022804634776:web:4c547efa80d625885734ed",
        measurementId: "G-5P543VP1EZ"
    };

    let firebaseDB = null;
    let firebaseInitialized = false;

    function initFirebase() {
        try {
            firebase.initializeApp(firebaseConfig);
            firebaseDB = firebase.database();
            firebaseInitialized = true;
            document.getElementById('firebaseStatus').textContent = '✅ Global Sync Active';
        } catch (e) {
            document.getElementById('firebaseStatus').textContent = '❌ Offline Mode';
        }
    }

    let state = {
        score: 0, timeLeft: 60, isGameActive: false, timerInterval: null,
        currentAge: "Age 12-16", name: "Anonymous"
    };

    const colors = ['#ef4444', '#3b82f6', '#10b981', '#f59e0b', '#8b5cf6', '#ec4899', '#ffffff'];
    const shapes = ['circle', 'square', 'triangle', 'star', 'hexagon'];

    const AGE_CONFIGS = {
        "Age < 8":   { timeBonus: 8, penalty: 2, levelStep: 50, startFreq: 400 },
        "Age 8-12":  { timeBonus: 5, penalty: 5, levelStep: 100, startFreq: 523 },
        "Age 12-16": { timeBonus: 4, penalty: 8, levelStep: 150, startFreq: 600 },
        "Age 16-20": { timeBonus: 3, penalty: 10, levelStep: 200, startFreq: 700 },
        "Age 20+":   { timeBonus: 2, penalty: 15, levelStep: 250, startFreq: 800 }
    };

    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;
    const synth = window.speechSynthesis;

    function initAudio() {
        if (!audioCtx) audioCtx = new AudioContext();
        if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playSound(type) {
        initAudio();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        const now = audioCtx.currentTime;

        if (type === 'correct') {
            osc.frequency.setValueAtTime(AGE_CONFIGS[state.currentAge].startFreq, now);
            osc.frequency.exponentialRampToValueAtTime(1000, now + 0.1);
            gain.gain.setValueAtTime(0.1, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
            osc.start(); osc.stop(now + 0.15);
        } else if (type === 'wrong') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(150, now);
            gain.gain.setValueAtTime(0.1, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
            osc.start(); osc.stop(now + 0.2);
        }
    }

    function speak(text) {
        if (!synth) return;
        synth.cancel();
        const utter = new SpeechSynthesisUtterance(text);
        utter.rate = 1.4;
        synth.speak(utter);
    }

    function setTheme(t) {
        document.body.setAttribute('data-theme', t);
        localStorage.setItem('eka_wordguess_theme', t);
        document.querySelectorAll('.theme-btn').forEach(b => {
            b.classList.toggle('selected', b.getAttribute('onclick').includes(`'${t}'`));
        });
    }

    function navTo(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        document.getElementById('game-stats-container').style.display = (id === 'screen-game') ? 'block' : 'none';
        document.getElementById('header-title').style.display = (id === 'screen-game') ? 'none' : 'block';
    }

    function handleStart() {
        const name = document.getElementById('playerName').value.trim();
        if(!name) { alert("Please enter name"); return; }
        state.name = name;
        state.currentAge = document.getElementById('ageSelect').value;
        localStorage.setItem('eka_player_name', name);

        initAudio();
        state.score = 0;
        state.timeLeft = 60;
        state.isGameActive = true;
        updateStats();
        navTo('screen-game');

        nextPrompt();
        if(state.timerInterval) clearInterval(state.timerInterval);
        state.timerInterval = setInterval(() => {
            if (!state.isGameActive) return;
            state.timeLeft--;
            updateTimerUI();
            if(state.timeLeft <= 0) endGame();
        }, 1000);
    }

    function updateTimerUI() {
        document.getElementById('disp-timer').textContent = `⏱️ ${state.timeLeft}s`;
        const pct = (state.timeLeft / 60) * 100;
        const bar = document.getElementById('timer-bar');
        bar.style.width = pct + "%";
        bar.style.backgroundColor = pct < 25 ? "var(--danger)" : "var(--success)";
    }

    function updateStats() {
        document.getElementById('disp-score').textContent = `🌟 ${state.score}`;
        document.getElementById('disp-level').textContent = state.currentAge.replace('Age ', '');
    }

    function nextPrompt() {
        const colorNames = ['Red', 'Blue', 'Green', 'Orange', 'Purple', 'Pink', 'White'];
        const idxC = Math.floor(Math.random() * colors.length);
        const idxS = Math.floor(Math.random() * shapes.length);
        const targetColor = colors[idxC];
        const targetColorName = colorNames[idxC];
        const targetShape = shapes[idxS];

        document.getElementById('prompt').innerHTML = `Find: <b style="color:${targetColor}">${targetColorName.toUpperCase()} ${targetShape.toUpperCase()}</b>`;
        speak(`${targetColorName} ${targetShape}`);
        renderGrid(targetColor, targetShape);
    }

    function renderGrid(targetC, targetS) {
        const grid = document.getElementById('shapesGrid');
        grid.innerHTML = '';
        let pool = [{ color: targetC, shape: targetS }];
        while(pool.length < 9) {
            let rc = colors[Math.floor(Math.random() * colors.length)];
            let rs = shapes[Math.floor(Math.random() * shapes.length)];
            if(!pool.find(p => p.color === rc && p.shape === rs)) pool.push({color: rc, shape: rs});
        }
        pool.sort(() => Math.random() - 0.5).forEach(item => {
            const cube = document.createElement('div');
            cube.className = 'icecube';
            const container = document.createElement('div');
            container.className = 'shape-container';

            if (item.shape === 'triangle') {
                const tri = document.createElement('div');
                tri.className = 'triangle';
                tri.style.borderBottomColor = item.color;
                container.appendChild(tri);
            } else {
                const shp = document.createElement('div');
                shp.className = item.shape;
                shp.style.backgroundColor = item.color;
                container.appendChild(shp);
            }

            cube.onclick = (e) => {
                if(!state.isGameActive) return;
                const config = AGE_CONFIGS[state.currentAge];
                if(item.color === targetC && item.shape === targetS) {
                    state.score += 10;
                    playSound('correct');
                    if (state.score % config.levelStep === 0) {
                        state.timeLeft = Math.min(60, state.timeLeft + config.timeBonus);
                    }
                    if(navigator.vibrate) navigator.vibrate(40);
                } else {
                    state.score = Math.max(0, state.score - config.penalty);
                    playSound('wrong');
                }
                updateStats();
                nextPrompt();
            };

            cube.appendChild(container);
            grid.appendChild(cube);
        });
    }

    function endGame() {
        state.isGameActive = false;
        clearInterval(state.timerInterval);
        document.getElementById('finalScore').textContent = state.score;
        navTo('screen-result');
    }

    async function submitScore() {
        if (state.score <= 0) { location.reload(); return; }
        const btn = document.getElementById('submitScoreBtn');
        btn.disabled = true; btn.textContent = 'SAVING...';

        if (firebaseInitialized) {
            try {
                await firebaseDB.ref('scores_snap').push({
                    name: state.name,
                    score: state.score,
                    level: state.currentAge,
                    timestamp: firebase.database.ServerValue.TIMESTAMP
                });
                btn.textContent = 'SAVED!';
            } catch(e) {
                console.error("Firebase Save Error:", e);
                btn.textContent = 'ERROR';
            }
        }
        setTimeout(() => showLeaderboard('recent'), 1000);
    }

    function showLeaderboard(mode = 'top') {
        navTo('screen-leaderboard');
        const tbody = document.getElementById('leaderboardBody');
        const btnTop = document.getElementById('btnTop');
        const btnRecent = document.getElementById('btnRecent');

        tbody.innerHTML = '<tr><td colspan="3" style="text-align:center">Syncing...</td></tr>';

        btnTop.classList.toggle('active', mode === 'top');
        btnRecent.classList.toggle('active', mode === 'recent');

        if (!firebaseInitialized) return;

        let query = firebaseDB.ref('scores_snap');
        if (mode === 'top') {
            query = query.orderByChild('score').limitToLast(15);
        } else {
            query = query.limitToLast(60);
        }

        query.once('value', snapshot => {
            let list = [];
            snapshot.forEach(child => {
                let val = child.val();
                val.score = val.score !== undefined ? val.score : (val.Score || 0);
                val.name = val.name || val.Name || 'Anonymous';
                val.level = val.level || val.age || 'Standard';
                list.push(val);
            });

            if (mode === 'top') {
                list.sort((a,b) => (parseInt(b.score)||0) - (parseInt(a.score)||0));
            } else {
                list.sort((a,b) => (b.timestamp || 0) - (a.timestamp || 0));
            }

            tbody.innerHTML = list.length ? list.map((s) => {
                const dateStr = s.timestamp ? new Date(s.timestamp).toLocaleDateString() : 'N/A';
                return `
                <tr>
                    <td><b>${s.name}</b><br><small>${s.level}</small></td>
                    <td style="font-weight:bold;color:var(--accent)">${s.score}</td>
                    <td style="font-size:0.7rem; opacity:0.7;">${dateStr}</td>
                </tr>`;
            }).join('') : '<tr><td colspan="3" style="text-align:center">No scores yet</td></tr>';
        }, err => {
            tbody.innerHTML = '<tr><td colspan="3" style="text-align:center; color:var(--danger)">Connection Error</td></tr>';
        });
    }

    window.onload = () => {
        const savedName = localStorage.getItem('eka_player_name');
        if (savedName) document.getElementById('playerName').value = savedName;
        setTheme(localStorage.getItem('eka_wordguess_theme') || '3d-glass');
        initFirebase();
    };
</script>
</body>
</html>
