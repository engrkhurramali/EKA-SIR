<!DOCTYPE html>
<html lang="en" data-theme="3d-glass">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>EKA ArrowEliminator</title>
    <style>
        /* ========== THEME VARIABLES ========== */
        :root, [data-theme="3d-glass"] {
            --bg-grad: linear-gradient(160deg, #e0e7ff 0%, #dbeafe 100%);
            --glass-bg: rgba(255, 255, 255, 0.4);
            --glass-border: rgba(255, 255, 255, 0.7);
            --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.06);
            --text-main: #1e293b;
            --text-sub: #475569;
            --accent: #10b981;
            --danger: #ef4444;
            --success: #10b981;
            --cell-bg: rgba(255,255,255,0.7);
        }

        [data-theme="modern-2x2"] {
            --bg-grad: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
            --glass-bg: rgba(255, 255, 255, 0.5);
            --glass-border: rgba(255, 255, 255, 0.8);
            --text-main: #44403c;
            --text-sub: #78716c;
            --accent: #fb923c;
            --danger: #ef4444;
            --success: #22c55e;
            --cell-bg: rgba(255,255,255,0.6);
        }

        [data-theme="dark-neon"] {
            --bg-grad: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            --glass-bg: rgba(30, 41, 59, 0.7);
            --glass-border: rgba(148, 163, 184, 0.2);
            --text-main: #f1f5f9;
            --text-sub: #94a3b8;
            --accent: #00f2ff;
            --danger: #f43f5e;
            --success: #34d399;
            --cell-bg: rgba(51, 65, 85, 0.9);
        }

        [data-theme="midnight-dark"] {
            --bg-grad: linear-gradient(135deg, #020617 0%, #0f172a 100%);
            --glass-bg: rgba(15, 23, 42, 0.8);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-main: #f1f5f9;
            --text-sub: #94a3b8;
            --accent: #38bdf8;
            --danger: #ef4444;
            --success: #22c55e;
            --cell-bg: rgba(30, 41, 59, 0.9);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body {
          font-family: system-ui, -apple-system, sans-serif;
          background: var(--bg-grad);
          background-size: 100% 200%;
          animation: bgFloat 20s ease infinite;
          color: var(--text-main);
          height: 100vh; height: 100dvh;
          width: 100vw;
          display: flex; justify-content: center; align-items: center;
          overflow: hidden; touch-action: none;
        }

        @keyframes bgFloat { 0% { background-position: 0% 0%; } 50% { background-position: 0% 100%; } 100% { background-position: 0% 0%; } }

        .app-container {
          width: 100vw; max-width: 480px;
          height: 100vh; height: 100dvh;
          display: flex; flex-direction: column;
          background: rgba(255,255,255,0.05);
          backdrop-filter: blur(15px);
          border-radius: 16px;
          box-shadow: 0 12px 35px rgba(0,0,0,0.2);
          border: 1px solid var(--glass-border);
          position: relative;
        }

        header {
          padding: 10px 12px; text-align: center; flex-shrink: 0;
          background: linear-gradient(to bottom, rgba(255,255,255,0.2), transparent);
          border-bottom: 1px solid var(--glass-border);
          position: relative;
          z-index: 50;
        }
        header h1 { font-size: 1.2rem; font-weight: 800; color: var(--accent); }

        .back-btn {
            position: absolute; left: 10px; top: 10px;
            text-decoration: none; background: rgba(255,255,255,0.3);
            width: 34px; height: 34px; display: flex; align-items: center; justify-content: center;
            border-radius: 10px; color: var(--text-main); font-weight: bold; border: 1px solid var(--glass-border);
        }

        .screens-wrapper { flex: 1; position: relative; overflow: hidden; display: flex; width: 100%; }
        .screen {
          position: absolute; inset: 0; padding: 10px;
          display: none; flex-direction: column; gap: 15px;
          animation: slideIn 0.3s ease forwards;
          overflow-y: auto; align-items: center;
          width: 100%;
        }
        .screen.active { display: flex; }
        @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .glass-card {
          background: var(--glass-bg); border: 1px solid var(--glass-border);
          border-radius: 20px; padding: 15px;
          box-shadow: var(--glass-shadow);
          display: flex; flex-direction: column; align-items: center; gap: 15px;
          width: 98%;
        }

        .input-glass {
            width: 100%; padding: 14px; border-radius: 12px;
            border: 1px solid var(--glass-border);
            background: rgba(255,255,255,0.2);
            color: var(--text-main); font-size: 1rem;
            outline: none; text-align: center; font-weight: 600;
        }

        .btn {
          min-height: 50px; width: 100%; padding: 0 20px;
          font-size: 1rem; font-weight: 700; border: none; border-radius: 12px;
          background: var(--cell-bg); color: var(--text-main);
          cursor: pointer; transition: all 0.2s;
          display: inline-flex; align-items: center; justify-content: center; gap: 8px;
          box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .btn.primary { background: var(--accent); color: white; }
        .btn:active { transform: scale(0.96); }

        .stats-row { display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; font-weight: 700; color: var(--text-sub); width: 100%; margin-top: 5px; }
        .timer-container { flex: 1; height: 8px; background: rgba(0,0,0,0.1); border-radius: 4px; margin: 0 10px; overflow: hidden; }
        #timer-bar { height: 100%; width: 100%; background: var(--success); transition: width 1s linear; }
        .stat-badge { background: var(--glass-bg); padding: 4px 10px; border-radius: 20px; white-space: nowrap; border: 1px solid var(--glass-border); }

        #canvas-wrapper {
            flex: 1; position: relative; width: 100%;
            background: rgba(0,0,0,0.05);
            border-radius: 15px; overflow: hidden;
            border: 1px solid var(--glass-border);
        }
        canvas { width: 100%; height: 100%; display: block; }

        .leaderboard {
            width: 100%; max-height: 50vh; overflow-y: auto; background: rgba(255,255,255,0.1);
            border-radius: 15px; border: 1px solid var(--glass-border);
            -webkit-overflow-scrolling: touch;
        }
        .leaderboard table { width: 100%; border-collapse: collapse; }
        .leaderboard th, .leaderboard td { padding: 12px; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.1); font-size: 0.85rem; }
        .leaderboard th { font-weight: 800; color: var(--accent); background: rgba(255,255,255,0.05); }

        .modal-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.6); display: none; justify-content: center; align-items: center; z-index: 1000; backdrop-filter: blur(5px); }
        .modal-overlay.active { display: flex; }
        .modal-box { background: var(--glass-bg); padding: 30px; border-radius: 24px; text-align: center; width: 85%; border: 1px solid var(--glass-border); box-shadow: 0 20px 50px rgba(0,0,0,0.3); }

        .heart-icon { color: #ef4444; }
    </style>
</head>
<body>

<div class="app-container">
    <header>
        <a href="games.html" class="back-btn">⬅</a>
        <h1>Arrow Eliminator</h1>
        <div id="game-stats-container" style="display:none; padding: 0 10px;">
            <div class="stats-row">
                <span class="stat-badge" id="disp-timer">⏱️ 180s</span>
                <div class="timer-container"><div id="timer-bar"></div></div>
                <span class="stat-badge" id="disp-level">Level 1</span>
                <span class="stat-badge" id="disp-score">🌟 0</span>
            </div>
            <div class="stats-row" style="margin-top: 2px;">
                <span class="stat-badge">REMAINING: <span id="count-display">0</span></span>
                <span class="stat-badge"><span class="heart-icon">❤️</span> <span id="chances-display">3</span></span>
            </div>
        </div>
    </header>

    <div class="screens-wrapper">
        <section id="screen-welcome" class="screen active">
            <div style="font-size: 2.2rem; font-weight: 900; color: var(--accent); text-align: center; margin: 20px 0;">ARROW ELIMINATOR</div>
            <div class="glass-card">
                <input type="text" id="playerName" class="input-glass" placeholder="Enter Your Name" maxlength="15">
                <select id="theme-select" class="input-glass" onchange="setTheme(this.value)">
                    <option value="3d-glass">🎨 3D Glass</option>
                    <option value="modern-2x2">🎨 Modern Orange</option>
                    <option value="dark-neon">🎨 Dark Neon</option>
                    <option value="midnight-dark">🎨 Midnight</option>
                </select>
                <button class="btn primary" onclick="startGame()">▶ START GAME</button>
                <button class="btn" onclick="showLeaderboard('top')">🏆 LEADERBOARD</button>
            </div>
            <p style="font-size: 0.8rem; text-align: center; color: var(--text-sub); padding: 10px;">Clear all arrows without crashing them! +5 points per arrow.</p>
        </section>

        <section id="screen-game" class="screen">
            <div id="canvas-wrapper">
                <canvas id="gameCanvas"></canvas>
            </div>
            <div style="width:100%; display:flex; gap:10px;">
                <button class="btn" style="flex:1; min-height: 44px; font-size: 0.9rem;" onclick="endGame(false)">🏳️ GIVE UP</button>
            </div>
        </section>

        <section id="screen-leaderboard" class="screen">
            <h2 style="margin: 10px 0;">🏆 Global Rankings</h2>
            <div style="display: flex; gap: 8px; margin-bottom: 10px; width: 98%;">
                <button class="btn" style="flex: 1; min-height: 40px; font-size: 0.8rem;" id="btnTop15" onclick="showLeaderboard('top')">Top 15</button>
                <button class="btn" style="flex: 1; min-height: 40px; font-size: 0.8rem; opacity: 0.6;" id="btnRecent60" onclick="showLeaderboard('recent')">Recent 60</button>
            </div>
            <div class="leaderboard">
                <table>
                    <thead><tr><th>Player</th><th>Score</th><th>Date</th></tr></thead>
                    <tbody id="leaderboardBody"></tbody>
                </table>
            </div>
            <button class="btn primary" style="margin-top: 15px;" onclick="navTo('screen-welcome')">Back to Menu</button>
        </section>
    </div>

    <div class="modal-overlay" id="modal-end">
        <div class="modal-box">
            <h2 id="modal-title">Level Clear!</h2>
            <p id="modal-msg"></p>
            <button class="btn primary" id="btn-modal-action">Next Level</button>
        </div>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAEcPKE7n33wNUGxYpyqm5UWFjwXTT_x_c",
        authDomain: "eka-sir.firebaseapp.com",
        databaseURL: "https://eka-sir-default-rtdb.firebaseio.com",
        projectId: "eka-sir",
        storageBucket: "eka-sir.firebasestorage.app",
        messagingSenderId: "1022804634776",
        appId: "1:1022804634776:web:4c547efa80d625885734ed",
        measurementId: "G-5P543VP1EZ"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // Game Variables
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const countDisplay = document.getElementById("count-display");
    const chancesDisplay = document.getElementById("chances-display");

    // Audio Context & Sounds
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function playSound(type) {
        try {
            if (!audioCtx) audioCtx = new AudioCtx();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            const now = audioCtx.currentTime;

            if (type === 'success') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(440, now);
                osc.frequency.exponentialRampToValueAtTime(880, now + 0.1);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(); osc.stop(now + 0.1);
            } else if (type === 'crash') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.linearRampToValueAtTime(50, now + 0.2);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
                osc.start(); osc.stop(now + 0.2);
            } else if (type === 'level-up') {
                osc.type = 'sine';
                [523.25, 659.25, 783.99, 1046.50].forEach((f, i) => {
                    const o = audioCtx.createOscillator();
                    const g = audioCtx.createGain();
                    o.type = 'sine';
                    o.frequency.value = f;
                    o.connect(g); g.connect(audioCtx.destination);
                    g.gain.setValueAtTime(0, now + i * 0.1);
                    g.gain.linearRampToValueAtTime(0.1, now + i * 0.1 + 0.05);
                    g.gain.linearRampToValueAtTime(0, now + i * 0.1 + 0.2);
                    o.start(now + i * 0.1); o.stop(now + i * 0.1 + 0.2);
                });
            } else if (type === 'game-over') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(200, now);
                osc.frequency.exponentialRampToValueAtTime(50, now + 0.5);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.linearRampToValueAtTime(0, now + 0.5);
                osc.start(); osc.stop(now + 0.5);
            }
        } catch(e) { console.error("Audio error", e); }
    }

    let state = {
        name: "", score: 0, level: 1,
        chances: 3, arrows: [], movingArrow: null,
        active: false, time: 180, maxTime: 180, interval: null,
        isTransitioning: false
    };
    let particles = [];

    const DIRECTIONS = ["UP", "DOWN", "LEFT", "RIGHT"];
    const ARROW_THICKNESS = 6;
    const HITBOX_PADDING = 14;

    function setTheme(theme) {
        document.documentElement.setAttribute('data-theme', theme);
        localStorage.setItem('eka_arrow_theme', theme);
    }

    function navTo(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        const stats = document.getElementById('game-stats-container');
        if (stats) stats.style.display = (id === 'screen-game') ? 'block' : 'none';

        if(id === 'screen-game') {
            resizeCanvas();
            setTimeout(resizeCanvas, 150);
        } else {
            clearInterval(state.interval);
            state.active = false;
        }
    }

    function resizeCanvas() {
        const rect = canvas.parentElement.getBoundingClientRect();
        if (rect.width > 0) {
            canvas.width = rect.width * window.devicePixelRatio;
            canvas.height = rect.height * window.devicePixelRatio;
            ctx.resetTransform();
            ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
        }
    }

    function startGame() {
        const name = document.getElementById('playerName').value.trim();
        if (!name) { alert("Please enter your name!"); return; }
        state.name = name;
        state.score = 0;
        state.level = 1;
        localStorage.setItem('eka_player_name', name);
        navTo('screen-game');
        setTimeout(initLevel, 300); // Wait for transition and resize
    }

    function initLevel() {
        state.chances = 3;
        state.movingArrow = null;
        state.isTransitioning = false;
        state.maxTime = 180 - (state.level - 1) * 10;
        state.time = state.maxTime;
        state.active = false;
        particles = [];

        generateSolvableBoard();

        // Ensure count is updated
        countDisplay.innerText = state.arrows.length;
        chancesDisplay.innerText = state.chances;
        document.getElementById('disp-level').textContent = `Level ${state.level}`;
        document.getElementById('disp-score').textContent = `🌟 ${state.score}`;
        updateTimerUI();

        clearInterval(state.interval);
        state.active = true;
        state.interval = setInterval(() => {
            if (!state.active) return;
            state.time--;
            updateTimerUI();
            if (state.time <= 0) endGame(false, "Time Up!");
        }, 1000);
    }

    function updateTimerUI() {
        document.getElementById('disp-timer').textContent = `⏱️ ${state.time}s`;
        const pct = (state.time / state.maxTime) * 100;
        document.getElementById('timer-bar').style.width = pct + '%';
        document.getElementById('timer-bar').style.background = pct < 25 ? 'var(--danger)' : 'var(--success)';
    }

    // Logic for board generation
    function getArrowBounds(a) {
        let halfL = a.length / 2;
        let hw = 10;
        if (a.dir === "UP" || a.dir === "DOWN") {
            return { minX: a.x - hw, maxX: a.x + hw, minY: a.y - halfL, maxY: a.y + halfL };
        } else {
            return { minX: a.x - halfL, maxX: a.x + halfL, minY: a.y - hw, maxY: a.y + hw };
        }
    }

    function isPathBlocked(a, b) {
        let boundsA = getArrowBounds(a);
        let boundsB = getArrowBounds(b);
        if (!(boundsA.maxX < boundsB.minX - 8 || boundsA.minX > boundsB.maxX + 8 ||
              boundsA.maxY < boundsB.minY - 8 || boundsA.minY > boundsB.maxY + 8)) return true;
        const checkRange = 20;
        if (a.dir === "UP" && b.y < a.y && Math.abs(a.x - b.x) < checkRange) return true;
        if (a.dir === "DOWN" && b.y > a.y && Math.abs(a.x - b.x) < checkRange) return true;
        if (a.dir === "LEFT" && b.x < a.x && Math.abs(a.y - b.y) < checkRange) return true;
        if (a.dir === "RIGHT" && b.x > a.x && Math.abs(a.y - b.y) < checkRange) return true;
        return false;
    }

    function verifyBoardSolvability(testArrows) {
        let tempList = [...testArrows];
        let progress = true;
        while (tempList.length > 0 && progress) {
            progress = false;
            for (let i = 0; i < tempList.length; i++) {
                let current = tempList[i];
                let blocked = false;
                for (let j = 0; j < tempList.length; j++) {
                    if (i !== j && isPathBlocked(current, tempList[j])) { blocked = true; break; }
                }
                if (!blocked) { tempList.splice(i, 1); progress = true; break; }
            }
        }
        return tempList.length === 0;
    }

    function generateSolvableBoard() {
        const rect = canvas.parentElement.getBoundingClientRect();
        let canvasWidth = rect.width || window.innerWidth;
        let canvasHeight = rect.height || (window.innerHeight * 0.6);

        if (canvasWidth < 100) canvasWidth = 360; // Fallback
        if (canvasHeight < 100) canvasHeight = 500;

        let targetArrows = 6 + (state.level - 1) * 3;
        let globalAttempts = 0;
        const xPadding = canvasWidth * 0.12;
        const yPadding = canvasHeight * 0.12;

        while (globalAttempts < 100) {
            globalAttempts++;
            state.arrows = [];
            let idCounter = 1;
            let packAttempts = 0;
            while (state.arrows.length < targetArrows && packAttempts < 500) {
                packAttempts++;
                let dir = DIRECTIONS[Math.floor(Math.random() * DIRECTIONS.length)];
                let length = Math.min(canvasWidth, canvasHeight) * 0.20;
                let cx = xPadding + Math.random() * (canvasWidth - xPadding * 2);
                let cy = yPadding + Math.random() * (canvasHeight - yPadding * 2);

                let p = { id: idCounter, x: cx, y: cy, dir: dir, length: length, thickness: ARROW_THICKNESS, state: "IDLE", offset: Math.random() * Math.PI * 2 };
                let overlap = false;
                let pb = getArrowBounds(p);
                for (let o of state.arrows) {
                    let ob = getArrowBounds(o);
                    if (!(pb.maxX < ob.minX - 12 || pb.minX > ob.maxX + 12 || pb.maxY < ob.minY - 12 || pb.minY > ob.maxY + 12)) { overlap = true; break; }
                }
                if (!overlap) { state.arrows.push(p); idCounter++; }
            }
            if (verifyBoardSolvability(state.arrows) && state.arrows.length >= Math.min(targetArrows, 4)) break;
        }
        countDisplay.innerText = state.arrows.length;
    }

    function getThemeColor(variable) {
        return getComputedStyle(document.documentElement).getPropertyValue(variable).trim();
    }

    function drawArrow(a) {
        ctx.save();
        ctx.translate(a.x, a.y);

        const accentColor = getThemeColor('--accent');
        const borderCol = getThemeColor('--glass-border');

        // Subtle floating animation
        const pulse = Math.sin(Date.now() / 300 + a.offset) * 2;
        if (a.state === "IDLE") ctx.translate(0, pulse);

        // 3D Tilt & Glow Effect when moving
        if (a.state === "MOVING") {
            ctx.scale(1.2, 1.2);
            ctx.shadowBlur = 25;
            ctx.shadowColor = accentColor;
        }

        if (a.dir === "DOWN") ctx.rotate(Math.PI);
        if (a.dir === "LEFT") ctx.rotate(-Math.PI / 2);
        if (a.dir === "RIGHT") ctx.rotate(Math.PI / 2);

        let halfL = a.length / 2;
        let t = a.thickness;

        // 3D Shaft Shadow (Bottom/Right offset)
        ctx.fillStyle = "rgba(0,0,0,0.15)";
        ctx.beginPath();
        if(ctx.roundRect) ctx.roundRect(-t/2 + 4, -halfL + 10, t, a.length - 12, 4);
        else ctx.rect(-t/2 + 4, -halfL + 10, t, a.length - 12);
        ctx.fill();

        // Main Shaft with Glassy Gradient
        let grad = ctx.createLinearGradient(-t/2, 0, t/2, 0);
        grad.addColorStop(0, "rgba(255,255,255,0.1)");
        grad.addColorStop(0.5, "rgba(255,255,255,0.5)");
        grad.addColorStop(1, "rgba(255,255,255,0.1)");

        ctx.fillStyle = grad;
        ctx.strokeStyle = borderCol;
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        if(ctx.roundRect) ctx.roundRect(-t/2, -halfL + 8, t, a.length - 12, 4);
        else ctx.rect(-t/2, -halfL + 8, t, a.length - 12);
        ctx.fill();
        ctx.stroke();

        // Glowing Core Line (Follows Theme)
        ctx.lineWidth = t * 0.5;
        ctx.strokeStyle = accentColor;
        ctx.lineCap = "round";
        ctx.beginPath();
        ctx.moveTo(0, -halfL + 14);
        ctx.lineTo(0, halfL - 8);
        ctx.stroke();

        // 3D Arrow Head (Themed)
        ctx.fillStyle = accentColor;
        ctx.beginPath();
        ctx.moveTo(0, -halfL);
        ctx.lineTo(15, -halfL + 18);
        ctx.lineTo(0, -halfL + 14);
        ctx.lineTo(-15, -halfL + 18);
        ctx.closePath();
        ctx.fill();

        // High gloss highlight
        ctx.fillStyle = "rgba(255,255,255,0.45)";
        ctx.beginPath();
        ctx.moveTo(0, -halfL);
        ctx.lineTo(8, -halfL + 10);
        ctx.lineTo(0, -halfL + 8);
        ctx.lineTo(-8, -halfL + 10);
        ctx.closePath();
        ctx.fill();

        ctx.restore();
    }

    function spawnParticles(x, y, isCrash = false) {
        const accent = getThemeColor('--accent');
        const danger = getThemeColor('--danger');
        const color = isCrash ? danger : accent;
        const count = isCrash ? 25 : 15;

        for(let i=0; i<count; i++) {
            particles.push({
                x, y,
                vx: (Math.random() - 0.5) * (isCrash ? 15 : 10),
                vy: (Math.random() - 0.5) * (isCrash ? 15 : 10),
                size: Math.random() * 5 + 2,
                life: 1.0,
                color: color
            });
        }
    }

    function update() {
        if (!state.active) { requestAnimationFrame(update); return; }
        const rect = canvas.parentElement.getBoundingClientRect();
        ctx.clearRect(0, 0, rect.width, rect.height);

        // Update Particles
        particles = particles.filter(p => p.life > 0);
        particles.forEach(p => {
            p.x += p.vx; p.y += p.vy;
            p.life -= 0.02;
            ctx.globalAlpha = p.life;
            ctx.fillStyle = p.color;
            ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill();
        });
        ctx.globalAlpha = 1.0;

        if (state.movingArrow) {
            const speed = 20;
            let vx = 0, vy = 0;
            if (state.movingArrow.dir === "UP") vy = -speed;
            if (state.movingArrow.dir === "DOWN") vy = speed;
            if (state.movingArrow.dir === "LEFT") vx = -speed;
            if (state.movingArrow.dir === "RIGHT") vx = speed;

            state.movingArrow.x += vx;
            state.movingArrow.y += vy;

            let boundsM = getArrowBounds(state.movingArrow);
            for (let other of state.arrows) {
                if (other.id !== state.movingArrow.id && other.state === "IDLE") {
                    let boundsO = getArrowBounds(other);
                    let hasCollision = !(boundsM.maxX < boundsO.minX || boundsM.minX > boundsO.maxX || boundsM.maxY < boundsO.minY || boundsM.minY > boundsO.maxY);
                    if (hasCollision) {
                        spawnParticles(state.movingArrow.x, state.movingArrow.y, true);
                        state.movingArrow.state = "IDLE";
                        state.movingArrow.x -= vx * 1.2;
                        state.movingArrow.y -= vy * 1.2;
                        state.movingArrow = null;
                        triggerCrash();
                        break;
                    }
                }
            }

            if (state.movingArrow) {
                if (state.movingArrow.x < -150 || state.movingArrow.x > rect.width + 150 || state.movingArrow.y < -150 || state.movingArrow.y > rect.height + 150) {
                    spawnParticles(
                        Math.max(10, Math.min(rect.width-10, state.movingArrow.x)),
                        Math.max(10, Math.min(rect.height-10, state.movingArrow.y))
                    );
                    state.arrows = state.arrows.filter(item => item.id !== state.movingArrow.id);
                    state.movingArrow = null;
                    state.score += 5;
                    playSound('success');
                    document.getElementById('disp-score').textContent = `🌟 ${state.score}`;
                    countDisplay.innerText = state.arrows.length;

                    if (state.arrows.length === 0 && !state.isTransitioning) {
                        state.isTransitioning = true;
                        setTimeout(() => endGame(true), 400);
                    }
                }
            }
        }

        state.arrows.forEach(drawArrow);
        requestAnimationFrame(update);
    }

    function triggerCrash() {
        state.chances--;
        playSound('crash');
        chancesDisplay.innerText = state.chances;
        if (state.chances <= 0) endGame(false, "Arrows Collided!");
    }

    function endGame(won, reason = "") {
        state.active = false;
        clearInterval(state.interval);
        const modal = document.getElementById('modal-end');
        const title = document.getElementById('modal-title');
        const msg = document.getElementById('modal-msg');
        const actionBtn = document.getElementById('btn-modal-action');

        if (won) {
            playSound('level-up');
            if (state.level >= 10) {
                title.textContent = "🏆 CHAMPION!";
                msg.textContent = `You cleared all 10 levels!\nFinal Score: ${state.score}`;
                actionBtn.textContent = "Return to Menu";
                actionBtn.onclick = () => {
                    actionBtn.onclick = null;
                    modal.classList.remove('active');
                    navTo('screen-welcome');
                };
                saveToLeaderboard();
            } else {
                title.textContent = "Level Clear! 🎉";
                msg.textContent = `Score: ${state.score}\nReady for Level ${state.level + 1}?`;
                actionBtn.textContent = "Next Level";
                actionBtn.onclick = () => {
                    actionBtn.onclick = null;
                    modal.classList.remove('active');
                    state.level++;
                    initLevel();
                };
            }
        } else {
            title.textContent = state.time <= 0 ? "Time Up! ⏰" : "Game Over! 💥";
            playSound('game-over');
            msg.textContent = `${reason}\nLevel: ${state.level}\nFinal Score: ${state.score}`;
            actionBtn.textContent = "Return to Menu";
            actionBtn.onclick = () => {
                actionBtn.onclick = null;
                modal.classList.remove('active');
                navTo('screen-welcome');
            };
            saveToLeaderboard();
        }
        modal.classList.add('active');
    }

    function saveToLeaderboard() {
        if (state.score <= 0) return;
        db.ref('scores_arrow').push({
            name: state.name,
            score: state.score,
            level: state.level,
            timestamp: firebase.database.ServerValue.TIMESTAMP
        }).catch(e => console.error("Save failed:", e));
    }

    function showLeaderboard(mode = 'top') {
        navTo('screen-leaderboard');
        const body = document.getElementById('leaderboardBody');
        const btnTop = document.getElementById('btnTop15');
        const btnRecent = document.getElementById('btnRecent60');

        btnTop.style.opacity = (mode === 'top') ? '1' : '0.6';
        btnRecent.style.opacity = (mode === 'recent') ? '1' : '0.6';

        body.innerHTML = '<tr><td colspan="3">Syncing...</td></tr>';
        let q = db.ref('scores_arrow');
        if (mode === 'top') q = q.orderByChild('score').limitToLast(15);
        else q = q.limitToLast(60);

        q.once('value', s => {
            let l = [];
            s.forEach(c => { let d = c.val(); d.key = c.key; l.push(d); });
            if (mode === 'top') l.sort((a, b) => b.score - a.score);
            else l.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));

            body.innerHTML = l.length ? l.map(item => {
                const date = item.timestamp ? new Date(item.timestamp).toLocaleDateString() : 'N/A';
                return `<tr><td><b>${item.name || 'Anon'}</b><br><small>Lvl ${item.level}</small></td><td style="font-weight:bold;color:var(--accent)">${item.score}</td><td style="font-size: 0.7rem; opacity: 0.7;">${date}</td></tr>`;
            }).join('') : '<tr><td colspan="3">No records.</td></tr>';
        });
    }

    function handleInput(clientX, clientY) {
        if (!state.active || state.movingArrow) return;
        const rect = canvas.getBoundingClientRect();
        const clickX = clientX - rect.left;
        const clickY = clientY - rect.top;

        let selected = null;
        let minDist = Infinity;

        for (let a of state.arrows) {
            let halfL = a.length / 2;
            let hx = a.x, hy = a.y, tx = a.x, ty = a.y;
            if (a.dir === "UP") { hy = a.y - halfL; ty = a.y + halfL; }
            if (a.dir === "DOWN") { hy = a.y + halfL; ty = a.y - halfL; }
            if (a.dir === "LEFT") { hx = a.x - halfL; tx = a.x + halfL; }
            if (a.dir === "RIGHT") { hx = a.x + halfL; tx = a.x - halfL; }

            let A = clickX - tx, B = clickY - ty, C = hx - tx, D = hy - ty;
            let dot = A * C + B * D;
            let lenSq = C * C + D * D;
            let param = lenSq !== 0 ? dot / lenSq : -1;
            let xx, yy;
            if (param < 0) { xx = tx; yy = ty; }
            else if (param > 1) { xx = hx; yy = hy; }
            else { xx = tx + param * C; yy = ty + param * D; }

            let dist = Math.hypot(clickX - xx, clickY - yy);
            if (dist < HITBOX_PADDING + 10 && dist < minDist) { minDist = dist; selected = a; }
        }

        if (selected) { selected.state = "MOVING"; state.movingArrow = selected; }
    }

    window.addEventListener("mousedown", (e) => handleInput(e.clientX, e.clientY));
    window.addEventListener("touchstart", (e) => { e.preventDefault(); handleInput(e.touches[0].clientX, e.touches[0].clientY); }, { passive: false });
    window.addEventListener("resize", resizeCanvas);

    window.onload = () => {
        const sn = localStorage.getItem('eka_player_name'); if (sn) document.getElementById('playerName').value = sn;
        const st = localStorage.getItem('eka_arrow_theme'); if (st) setTheme(st);
        update();
    };
</script>
</body>
</html>
